name: listora
description: "Listora marketplace app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.0
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.1
  go_router: ^18.1.4
  image_picker: ^1.2.4
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.3
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  image_picker_platform_interface: ^2.11.2

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/IBMPlexSans-LICENSE.txt

  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
